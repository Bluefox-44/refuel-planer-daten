name: Daten bauen und veröffentlichen

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: osmium-tool installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-Pakete installieren
        run: pip install osmium "shapely>=2.0" pillow numpy

      - name: Geofabrik-Daten laden
        run: |
          curl -fL -o switzerland-latest.osm.pbf https://download.geofabrik.de/europe/switzerland-latest.osm.pbf
          curl -fL -o switzerland.poly https://download.geofabrik.de/europe/switzerland.poly

      - name: Vorfiltern (Schweiz und Nachbargebiete)
        run: |
          FILTER="nwr/shop=bakery,pastry,supermarket,convenience,kiosk,deli,farm
          nwr/amenity=cafe,restaurant,fast_food,ice_cream,fuel,drinking_water,vending_machine,fountain,shelter
          nwr/railway=station,halt
          nwr/highway=bus_stop
          nwr/tourism=alpine_hut,wilderness_hut"
          mkdir -p parts
          osmium tags-filter switzerland-latest.osm.pbf $FILTER -o parts/ch.osm.pbf --overwrite
          # Nachbar-Extrakte: einzeln laden, filtern, Original sofort loeschen (Platz auf dem Runner)
          for name in \
            europe/germany/baden-wuerttemberg \
            europe/germany/bayern/schwaben \
            europe/france/alsace \
            europe/france/franche-comte \
            europe/france/rhone-alpes \
            europe/italy/nord-ovest \
            europe/italy/nord-est \
            europe/austria \
            europe/liechtenstein; do
            short=$(basename "$name")
            echo "== $name"
            curl -fL --retry 3 -o "nb-$short.osm.pbf" "https://download.geofabrik.de/$name-latest.osm.pbf"
            osmium tags-filter "nb-$short.osm.pbf" $FILTER -o "parts/$short.osm.pbf" --overwrite
            rm -f "nb-$short.osm.pbf"
          done
          ls -l parts
          # Auf CH + 20-km-Band zuschneiden und zusammenfuehren
          BBOX=$(python tools/build.py --poly switzerland.poly --print-bbox)
          echo "Bounding-Box: $BBOX"
          osmium merge parts/*.osm.pbf -o merged.osm.pbf --overwrite
          osmium extract -b "$BBOX" merged.osm.pbf -o filtered.osm.pbf --overwrite
          ls -l filtered.osm.pbf

      - name: Vorfiltern (Gemeinden)
        run: |
          osmium tags-filter switzerland-latest.osm.pbf \
            r/admin_level=4,8 \
            w/highway=residential,unclassified,tertiary,secondary,primary,trunk,service,track \
            n/place=city,town \
            n/mountain_pass=yes \
            -o gemeinden.osm.pbf --overwrite

      - name: Kacheln bauen
        shell: bash  # mit pipefail, sonst verdeckt tee einen Fehler von build.py
        run: python tools/build.py --pbf filtered.osm.pbf --ts-pbf switzerland-latest.osm.pbf --poly switzerland.poly --out site | tee build.log

      - name: Terrain-Kacheln cachen
        uses: actions/cache@v4
        with:
          path: terrain-cache
          key: terrain-tiles-z11-v1

      - name: Gemeinden bauen
        run: python tools/gemeinden.py --pbf gemeinden.osm.pbf --out site --cache terrain-cache

      - name: Keepalive (STAND.md)
        run: |
          SUMMARY=$(tail -n 1 build.log)
          printf '# Stand\n\n%s\n' "$SUMMARY" > STAND.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STAND.md
          if git diff --cached --quiet; then
            echo "STAND.md unverändert"
          else
            git commit -m "Stand aktualisiert"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
